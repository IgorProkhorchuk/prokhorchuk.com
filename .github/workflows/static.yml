name: Deploy to prokhorchuk.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: prokhorchuk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: svelte-kit
    outputs:
      artifact-id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: svelte-kit/.nvmrc
          cache: npm
          cache-dependency-path: svelte-kit/package-lock.json

      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Check types and components
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Upload site
        id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: svelte-kit/build/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://prokhorchuk.com
    steps:
      - name: Download this build only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: site
          merge-multiple: true
          digest-mismatch: error

      - name: Deploy over restricted SSH
        shell: bash
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${REMOTE_HOST:?Missing production REMOTE_HOST}"
          : "${REMOTE_PORT:?Missing production REMOTE_PORT}"
          : "${REMOTE_USER:?Missing production REMOTE_USER}"
          : "${SSH_PRIVATE_KEY:?Missing production SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing production SSH_KNOWN_HOSTS}"

          [[ "$REMOTE_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || {
            echo 'Invalid deployment hostname'; exit 1;
          }
          [[ "$REMOTE_USER" == 'deploy-prokhorchuk' ]] || {
            echo 'Deployment must use the restricted deploy-prokhorchuk account'; exit 1;
          }
          [[ "$REMOTE_PORT" =~ ^[0-9]{1,5}$ ]] &&
            (( 10#$REMOTE_PORT >= 1 && 10#$REMOTE_PORT <= 65535 )) || {
              echo 'Invalid SSH port'; exit 1;
            }
          test -s site/index.html
          test -d site/_app
          if find site -type l -print -quit | grep -q .; then
            echo 'Refusing to deploy symlinks'; exit 1
          fi

          umask 077
          key_file="$RUNNER_TEMP/prokhorchuk-deploy-key"
          hosts_file="$RUNNER_TEMP/prokhorchuk-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh-keygen -y -P '' -f "$key_file" > /dev/null
          lookup_host="$REMOTE_HOST"
          if [[ "$REMOTE_PORT" != '22' ]]; then
            lookup_host="[$REMOTE_HOST]:$REMOTE_PORT"
          fi
          ssh-keygen -F "$lookup_host" -f "$hosts_file" > /dev/null

          ssh_options=(
            -i "$key_file" -p "$REMOTE_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$hosts_file"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o UpdateHostKeys=no -o ForwardAgent=no
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
            -o ConnectTimeout=15 -o ConnectionAttempts=1
          )
          printf -v ssh_command '%q ' ssh "${ssh_options[@]}"
          # rrsync on the server fixes . to this site's webroot. No remote shell.
          rsync -rtpz --delete --delay-updates --chmod=D755,F644 \
            --exclude=/.well-known/ --exclude=/.htaccess \
            -e "$ssh_command" -- site/ "$REMOTE_USER@$REMOTE_HOST:."
